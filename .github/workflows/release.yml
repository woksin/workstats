name: Release

# Cuts a release and attaches binaries for the platforms workstats supports.
#
# The version is not kept in the repository. It comes from the label on the
# merged pull request — `major`, `minor` or `patch` — which the release step
# turns into the next semantic version and a GitHub release. A merge carrying
# none of those labels releases nothing, so this can run on every push without
# a paths filter.
#
# Triggering on push rather than on the closed pull request is deliberate: a
# pull request from a fork runs with a read-only token even when merged, and
# creating a release would fail with a 403. A push to the default branch
# always has a full-permission token, and the action finds the merged pull
# request from the commit.
#
# A run with no merged pull request behind it — or one carrying none of those
# labels — releases nothing. To force a version by hand, run this workflow
# with an explicit `version`; left at the 0.0.0 placeholder it stays a no-op.
#
# The release object is created before any binary exists, so a build that
# falls over leaves a version people can see and cannot download. The last job
# holds the finished release up against the list of assets it was supposed to
# carry, fails the run when they are not all there, and takes the release out
# of `Latest` until they are — see `Check the release is complete` for what
# that failure does and how to get back out of it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. 0.0.0 means: work it out from the merged pull request."
        required: true
        default: "0.0.0"
        type: string
      release-notes:
        description: "Release notes. Left empty, GitHub generates them."
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Releases are cumulative and must not overtake one another, so a run in
# progress is allowed to finish rather than being cancelled by the next push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.should-publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      # The GitHub release is created by this action's post step, at the end
      # of this job — so it exists by the time the binaries job starts and has
      # something to upload to.
      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  binaries:
    name: ${{ matrix.asset }}
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      # Not fail-fast: one platform losing the network should not throw away
      # five builds that were going to succeed. It does mean a failure here
      # leaves the release short of exactly the assets it could not build,
      # which is what the `verify` job is there to notice.
      fail-fast: false
      matrix:
        # Six platforms, and the `verify` job carries the same six by asset
        # name. A platform added, dropped or renamed here has to be added,
        # dropped or renamed there too: that list is what decides whether a
        # release is complete, and it has no way of working out on its own
        # that a seventh was meant to exist.
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            exe: .exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            asset: windows-x86
            exe: .exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The version lives in the release, not in the repository, so it is
      # stamped in here rather than committed — the same shape as passing
      # -p:Version= to a dotnet publish. Without this every downloaded binary
      # would report the placeholder in Cargo.toml when asked --version.
      - name: Stamp the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # No /g: only the package's own version, never a dependency's.
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/m" Cargo.toml
          stamped="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$stamped" != "$VERSION" ]]; then
            echo "Cargo.toml still says $stamped, expected $VERSION" >&2
            exit 1
          fi

      # Not --locked: the stamp above just changed Cargo.toml's version without
      # touching Cargo.lock's matching entry, and --locked refuses to build
      # against a lock file that disagrees with the manifest.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Checked rather than assumed: a cross-compiled binary that will not run
      # is worth finding here and not in an issue. The macOS x86_64 build is
      # the one case that cannot be checked, since the runner is arm64.
      - name: Check executable
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXECUTABLE: target/${{ matrix.target }}/release/workstats${{ matrix.exe }}
        run: |
          set -euo pipefail
          reported=$("./$EXECUTABLE" --version | tr -d '\r')
          echo "$reported"
          [[ "$reported" == "workstats $VERSION" ]]

      # Named for the machine rather than for the Rust target triple that built
      # it, and the version is deliberately not in the file name either: it
      # makes `releases/latest/download/workstats-<platform>.tar.gz` a stable
      # URL. Which version a tarball holds is on the release it hangs off, and
      # in `workstats --version`.
      - name: Package
        env:
          BUILT: target/${{ matrix.target }}/release/workstats${{ matrix.exe }}
          NAME: workstats-${{ matrix.asset }}
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.exe }}" ]]; then
            cp "$BUILT" "${NAME}.exe"
            asset="${NAME}.exe"
          else
            tar -czf "${NAME}.tar.gz" -C "$(dirname "$BUILT")" workstats
            asset="${NAME}.tar.gz"
          fi
          if command -v shasum >/dev/null; then
            digest=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          else
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: workstats-${{ matrix.asset }}
          path: |
            workstats-*.tar.gz
            workstats-*.exe
            workstats-*.sha256

  attach:
    name: Attach binaries to the release
    if: needs.release.outputs.publish == 'true'
    needs: [release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          rm artifacts/*.sha256
          cat artifacts/SHA256SUMS

      # The release itself already exists (created by cratis/release-action's
      # post step in the `release` job), so this uploads assets to it rather
      # than creating a new one. --clobber makes re-running this job safe.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release.outputs.tag }}" \
            artifacts/*.tar.gz \
            artifacts/*.exe \
            artifacts/SHA256SUMS \
            --clobber

  homebrew:
    name: Update the Homebrew tap
    if: needs.release.outputs.publish == 'true'
    needs: [release, attach]
    runs-on: ubuntu-latest

    # A deploy key rather than a personal access token: it grants write to the
    # tap repository and to nothing else, so the worst a leak can do is publish
    # a bad formula. A PAT would carry every repository the account can reach.
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      TAP_REPO: woksin/homebrew-workstats
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}

    steps:
      # The guard below has to tell "no tap on purpose" apart from "the README
      # promises a tap that does not exist", and the only thing that knows the
      # difference is the README itself. A sparse checkout of that one file is
      # the whole reason this job needs a working tree at all.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      # The tap is optional. Cutting a release before it is set up should
      # publish the binaries and say the tap was skipped, not fail the release
      # and leave the assets looking broken.
      #
      # Optional is not the same as silent, though. This step used to write one
      # line to the step summary and exit green, which is invisible from the
      # Actions list and from a PR check — so a README telling people to
      # `brew install` sat next to a tap that was never written to, release
      # after release, with nothing anywhere to say so. Hence two outcomes
      # instead of one: a warning annotation when the tap is deliberately
      # absent, and a failed release when the README says otherwise.
      - name: Is the tap configured?
        id: guard
        run: |
          set -euo pipefail

          # Both spellings of the instruction count: the fully-qualified
          # one-liner (`brew install woksin/workstats/workstats`) and the older
          # `brew tap woksin/workstats` pair. Either one tells a reader the tap
          # is there for them.
          advertised=false
          if [ -f README.md ] && grep -qE 'brew (tap|install) woksin/' README.md; then
            advertised=true
          fi

          if [ -n "${TAP_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$advertised" = true ]; then
            echo "::error title=Homebrew tap advertised but not configured::README.md tells users to install workstats with Homebrew, but HOMEBREW_TAP_DEPLOY_KEY is not set on this repository, so the tap cannot be updated. Either configure the deploy key or remove the Homebrew instructions from README.md."
            exit 1
          else
            # An annotation, not just a summary line: it shows up in the run
            # header and in the Actions list, where somebody will actually see
            # it.
            echo "::warning title=Homebrew tap skipped::No HOMEBREW_TAP_DEPLOY_KEY secret, so the tap was not updated. README.md does not advertise a Homebrew install, so this is treated as deliberate."
            echo "No HOMEBREW_TAP_DEPLOY_KEY secret — skipping the tap." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.guard.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Write the formula
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail

          # Hashed here, at statement level, and not as `$(sha …)` inside the
          # heredoc below. `set -e` does not fire on a command substitution in
          # that position: a missing artifact would print an error, expand to
          # nothing, and ship `sha256 ""` from a step that exits 0 — a green
          # release that hands every user a checksum mismatch. An assignment is
          # somewhere errexit can see, so the same accident stops the job.
          sha() {
            local file="./artifacts/workstats-$1.tar.gz" digest
            if [ ! -f "$file" ]; then
              echo "missing artifact: $file" >&2
              exit 1
            fi
            # The same either/or as the Package step: neither tool is
            # guaranteed on every runner image, and this one used to assume
            # shasum. A missing shasum would have emptied all four fields.
            if command -v sha256sum >/dev/null; then
              digest=$(sha256sum "$file" | cut -d' ' -f1)
            else
              digest=$(shasum -a 256 "$file" | cut -d' ' -f1)
            fi
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "not a sha256 digest for $file: '$digest'" >&2
              exit 1
            fi
            printf '%s' "$digest"
          }

          sha_macos_arm=$(sha macos-arm64)
          sha_macos_x86=$(sha macos-x86_64)
          sha_linux_arm=$(sha linux-arm64)
          sha_linux_x86=$(sha linux-x86_64)
          base="https://github.com/woksin/workstats/releases/download/${TAG}"

          mkdir -p out
          cat > out/workstats.rb <<RUBY
          # Generated by the release workflow in woksin/workstats. Do not edit by hand.
          class Workstats < Formula
            desc "See where the work happened, without sending your work anywhere"
            homepage "https://github.com/woksin/workstats"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/workstats-macos-arm64.tar.gz"
                sha256 "${sha_macos_arm}"
              end
              on_intel do
                url "${base}/workstats-macos-x86_64.tar.gz"
                sha256 "${sha_macos_x86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/workstats-linux-arm64.tar.gz"
                sha256 "${sha_linux_arm}"
              end
              on_intel do
                url "${base}/workstats-linux-x86_64.tar.gz"
                sha256 "${sha_linux_x86}"
              end
            end

            def install
              bin.install "workstats"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/workstats --version")
            end
          end
          RUBY

          # Checked rather than assumed, in the same spirit as the binaries
          # job's "Check executable": the formula is the artifact this job
          # ships, and an empty `sha256` in it is indistinguishable from a
          # tampered download to everyone downstream. Four fields, all filled,
          # or nothing gets pushed.
          if grep -q 'sha256 ""' out/workstats.rb; then
            echo "the generated formula has an empty sha256 field" >&2
            exit 1
          fi
          if [ "$(grep -c '^      sha256 "' out/workstats.rb)" -ne 4 ]; then
            echo "expected 4 sha256 fields in the generated formula" >&2
            exit 1
          fi

          cat out/workstats.rb

      - name: Push it to the tap
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp out/workstats.rb tap/Formula/workstats.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Staged first, then compared against HEAD. `git diff` alone does not
          # see a file that does not exist yet, so the very first formula would
          # look like "no change" and never be pushed.
          git add Formula/workstats.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${VERSION}, nothing to push."
            exit 0
          fi
          git commit -m "workstats ${VERSION}"
          git push

      # Pushing is not publishing. A deploy key that lost write access, a tap
      # whose default branch moved, a push that raced another run — each of
      # those can leave this job green with nothing usable at the far end. So
      # fetch the formula back out of the tap, anonymously as far as the tap is
      # concerned, and insist it is the version this run just cut. The job
      # cannot claim success unless the file is right where a user will find
      # it.
      - name: Verify the published formula
        if: steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A few seconds of lag between the push and the contents API is
          # normal and would otherwise fail a release for no reason. Three
          # looks, then take the answer at face value.
          published=""
          for attempt in 1 2 3; do
            published=$(gh api "repos/${TAP_REPO}/contents/Formula/workstats.rb" --jq '.content' | base64 -d) || published=""
            if printf '%s\n' "$published" | grep -qF "version \"${VERSION}\""; then
              break
            fi
            [ "$attempt" = 3 ] || sleep 5
          done

          printf '%s\n' "$published"

          if ! printf '%s\n' "$published" | grep -qF "version \"${VERSION}\""; then
            echo "${TAP_REPO} does not publish workstats ${VERSION}" >&2
            exit 1
          fi
          if printf '%s\n' "$published" | grep -q 'sha256 ""'; then
            echo "${TAP_REPO} published a formula with an empty sha256 field" >&2
            exit 1
          fi

          echo "Tap published workstats ${VERSION}." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Check the release is complete
    # `if: always()` alongside a `needs` on every other job is the entire point
    # of this one, and the reason it could not have been folded into `attach`
    # or `homebrew`. Those two are wired downstream of the builds, so a build
    # that fails skips them — and a skipped job reports nothing. That is how
    # 1.2.0 went out: one build lost DNS while installing the toolchain,
    # `attach` and `homebrew` were skipped rather than failed, and all anybody
    # saw was a release sitting at `Latest` with no assets on it and a tap
    # still advertising the version before. Every guard added to those jobs
    # was, by construction, in the one place that does not run when this goes
    # wrong. This job runs whatever happened upstream.
    #
    # The `publish` condition stays because a run that released nothing has no
    # release to check. If the `release` job itself failed there is no output
    # to read and this is skipped as well, which is the right answer: that run
    # is already red, and the release object is created by that job's post
    # step, so a failure there leaves nothing behind to go stale.
    if: always() && needs.release.outputs.publish == 'true'
    needs: [release, binaries, attach, homebrew]
    runs-on: ubuntu-latest

    # No checkout: `gh` reads the release over the API, and GH_REPO is what
    # tells it which repository that is.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Does the release carry every asset?
        run: |
          set -euo pipefail

          # Written out here rather than derived from the build matrix on
          # purpose: a check that learns what "complete" means from the run it
          # is checking would call a release with no binaries at all complete,
          # which is precisely the case it exists to catch. Six platforms,
          # plus the checksum file `workstats update` reads before it installs
          # anything.
          expected=(
            workstats-macos-arm64.tar.gz
            workstats-macos-x86_64.tar.gz
            workstats-linux-x86_64.tar.gz
            workstats-linux-arm64.tar.gz
            workstats-windows-x86_64.exe
            workstats-windows-x86.exe
            SHA256SUMS
          )

          # Marking the release a prerelease is the one repair this job can
          # make, and both the missing-binaries case and the incomplete-
          # checksums case want it, so it lives in one place.
          #
          # It is not cosmetic. `Latest` is what the releases page offers,
          # what `releases/latest/download/…` resolves to, and what
          # `workstats update` asks the API for — so a half-published release
          # holding `Latest` is the actual damage: a version everyone is
          # pointed at, nobody can install, and which shadows the last one
          # that worked. A prerelease keeps its tag, its notes and whichever
          # assets did land, all still downloadable at the same URLs; it
          # simply stops being the release users are sent to, and the last
          # complete release takes that back until this one is whole.
          demote() {
            if [ "$(jq -r '.isPrerelease' <<<"$release")" != "true" ]; then
              gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
                -F prerelease=true -f make_latest=false >/dev/null
            fi
          }

          # Three looks before believing the answer, as in the tap job's
          # read-back and for the same reason: `gh release upload` in the
          # attach job and the API that lists what it uploaded are not the
          # same system, and a release read moments after the last upload can
          # still be a step behind. An asset that is still arriving is listed
          # with state "starter", so "uploaded and not empty" is the only
          # shape that counts as attached.
          release=""
          for attempt in 1 2 3; do
            release=$(gh release view "$TAG" --json databaseId,assets,isDraft,isPrerelease) || release=""
            if [ -n "$release" ] &&
              [ "$(jq '[.assets[] | select(.state == "uploaded" and .size > 0)] | length' <<<"$release")" -ge "${#expected[@]}" ]; then
              break
            fi
            [ "$attempt" = 3 ] || sleep 5
          done

          # Unknown is not the same as broken, and guessing either way would
          # be worse than saying so — nothing is demoted here, because the
          # release may be perfectly fine and unreachable only for as long as
          # the API is.
          if [ -z "$release" ]; then
            echo "::error title=Could not read release $TAG::The release could not be read back from the API, so whether $TAG carries its binaries is unknown. Check the releases page by hand before telling anyone this version is out. Re-running this job is safe and will answer the question once the API has recovered."
            exit 1
          fi

          release_id=$(jq -r '.databaseId' <<<"$release")

          missing=()
          for name in "${expected[@]}"; do
            jq -e --arg name "$name" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
              <<<"$release" >/dev/null || missing+=("$name")
          done

          # The motivating failure. The message has to carry the way out of it
          # or it only moves the confusion somewhere else: the release object
          # and its tag already exist, the upload step runs with --clobber, so
          # re-running the jobs that failed is the whole fix. Which button
          # matters is worth spelling out, because "Re-run all jobs" sits next
          # to the one that is wanted and would send the version through the
          # release action a second time.
          if [ "${#missing[@]}" -gt 0 ]; then
            demote
            recovery="Nothing has to be re-cut: the release object and its tag already exist, and the upload step runs with --clobber. Use \"Re-run failed jobs\" on $RUN_URL — not \"Re-run all jobs\", which would work the version out again — and the builds that failed will attach their binaries, after which this job restores $TAG to Latest on its own."
            echo "::error title=$TAG is missing ${#missing[@]} of ${#expected[@]} release assets::Missing: ${missing[*]}. $TAG has been marked a prerelease, so Latest points at the last complete release rather than at one nobody can download. $recovery"
            {
              echo "### $TAG went out incomplete"
              echo
              echo "Missing from the release:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
              echo
              echo "Marked a prerelease, so \`Latest\` points at the last complete release instead."
              echo
              echo "$recovery"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Every asset attached but the release unpublished is the same
          # outcome by another road: a draft is invisible to the releases
          # page, to `releases/latest/download/…` and to `workstats update`.
          # Nothing this job could do about it is safe to do unasked —
          # publishing a draft somebody left deliberately would be worse than
          # the draft — so it says so and stops.
          if [ "$(jq -r '.isDraft' <<<"$release")" = "true" ]; then
            echo "::error title=$TAG is still a draft::All ${#expected[@]} assets are attached, but the release is a draft, which is invisible to the releases page, to releases/latest/download/… and to workstats update. Publish it from the releases page, then re-run this job."
            exit 1
          fi

          # SHA256SUMS is not decoration. `workstats update` downloads it,
          # finds the line naming the asset it is about to install, and
          # refuses the download when the digest does not match — so a
          # checksum file that never names a platform is a platform that
          # cannot self-update, however many binaries hang off the release.
          # Read the published file back out of the release and insist every
          # binary is in it, in the same spirit as the tap job reading its
          # formula back out of the tap.
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          cat SHA256SUMS

          unlisted=()
          for name in "${expected[@]}"; do
            # SHA256SUMS does not list itself, and is not meant to: nothing
            # verifies the verifier.
            [ "$name" = SHA256SUMS ] && continue
            grep -qE "^[0-9a-f]{64}[[:space:]]+\*?${name}\$" SHA256SUMS || unlisted+=("$name")
          done

          if [ "${#unlisted[@]}" -gt 0 ]; then
            demote
            echo "::error title=SHA256SUMS on $TAG does not cover every binary::Not listed: ${unlisted[*]}. workstats update refuses any download it cannot check a digest for, so those platforms cannot move to $TAG. $TAG has been marked a prerelease, so Latest points at the last complete release. Re-run the failed jobs on $RUN_URL: the attach job rebuilds SHA256SUMS from the packaged artifacts and re-uploads it with --clobber."
            exit 1
          fi

          # The other half of the demotion above: a re-run that fixed the
          # builds arrives here with everything attached and puts the release
          # back where it belongs. Conditional on purpose — a release that
          # went out cleanly the first time must not have this job touching it
          # at all — and safe to key off the prerelease flag alone, because
          # this workflow has no way to cut a prerelease deliberately, so a
          # prerelease carrying a full set of assets can only be one an
          # earlier attempt demoted.
          if [ "$(jq -r '.isPrerelease' <<<"$release")" = "true" ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
              -F prerelease=false -f make_latest=true >/dev/null
            echo "::notice title=$TAG restored to Latest::All ${#expected[@]} assets are attached, so the prerelease mark left by an earlier attempt has been removed."
            echo "Restored **$TAG** to Latest: all ${#expected[@]} assets are attached, and SHA256SUMS covers every binary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**$TAG** publishes all ${#expected[@]} assets, and SHA256SUMS covers every binary." >> "$GITHUB_STEP_SUMMARY"
          fi
