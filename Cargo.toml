[package]
name = "workstats"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Local Git and AI-assisted work activity statistics across tools"
license = "MIT"
repository = "https://github.com/woksin/workstats"
homepage = "https://github.com/woksin/workstats"
readme = "README.md"
keywords = ["productivity", "git", "ai", "analytics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "workstats"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
globset = "0.4"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"
