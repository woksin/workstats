[package]
name = "workstats"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "Local Git and AI-assisted work activity statistics across tools"
license = "MIT"
repository = "https://github.com/woksin/workstats"
homepage = "https://github.com/woksin/workstats"
readme = "README.md"
keywords = ["productivity", "git", "ai", "analytics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "workstats"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
# Pinned together on purpose: ratatui 0.30 pulls crossterm 0.29 through
# ratatui-crossterm, and the explorer passes crossterm key events straight into
# ratatui, so the two must resolve to one crossterm.
crossterm = "0.29"
csv = "1.3"
flate2 = "1.1.9"
globset = "0.4"
ratatui = "0.30"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
self-replace = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.20"
ureq = "3.4.0"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"
